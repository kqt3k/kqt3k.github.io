<!DOCTYPE html>
<html lang="ru" data-theme="d-dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Супер Пеинт 2.0</title>
<style>
/* ============================================================
   ТЕМЫ (10 штук: 5 ПК + 5 мобильных)
   ============================================================ */
:root { --radius:10px; --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
html[data-theme="d-dark"]{
  --bg:#0d0f12; --panel:#1b1e24; --panel2:#23272f; --border:#2a2f38; --input:#14161a;
  --text:#e6e8ec; --muted:#7c8595; --muted2:#5f6878; --accent:#2f6fed; --accentText:#fff;
  --stageBg: radial-gradient(circle at 50% 40%, #1a1d23 0%, #0d0f12 100%);
}
html[data-theme="d-light"]{
  --bg:#eef1f6; --panel:#ffffff; --panel2:#f2f4f8; --border:#d7dce5; --input:#f7f9fc;
  --text:#1b2130; --muted:#6b7484; --muted2:#8a93a3; --accent:#2563eb; --accentText:#fff;
  --stageBg: radial-gradient(circle at 50% 40%, #e7ecf4 0%, #d5dce8 100%);
}
html[data-theme="d-midnight"]{
  --bg:#0a0a1a; --panel:#141428; --panel2:#1d1d38; --border:#2b2b4d; --input:#0f0f20;
  --text:#dcdcff; --muted:#8888b3; --muted2:#66668c; --accent:#8b5cf6; --accentText:#fff;
  --stageBg: radial-gradient(circle at 50% 40%, #16162e 0%, #07070f 100%);
}
html[data-theme="d-terminal"]{
  --bg:#050805; --panel:#0a0f0a; --panel2:#0f170f; --border:#1d331d; --input:#0a0f0a;
  --text:#9dff9d; --muted:#4f8a4f; --muted2:#3a6b3a; --accent:#22c55e; --accentText:#04120a;
  --font: ui-monospace, "SFMono-Regular", Consolas, monospace;
  --stageBg: radial-gradient(circle at 50% 40%, #0a120a 0%, #030503 100%);
}
html[data-theme="d-paper"]{
  --bg:#efe6d8; --panel:#faf4ea; --panel2:#f2e9db; --border:#d8cbb8; --input:#fdfaf4;
  --text:#3b3229; --muted:#8a7a66; --muted2:#a99a86; --accent:#b45309; --accentText:#fff;
  --stageBg: radial-gradient(circle at 50% 40%, #f6efe3 0%, #e2d6c3 100%);
}
html[data-theme="m-dark"]{
  --bg:#101014; --panel:#18181f; --panel2:#22222c; --border:#2c2c38; --input:#101014;
  --text:#f0f0f5; --muted:#8a8a9a; --muted2:#63636f; --accent:#ff5c8a; --accentText:#fff;
  --radius:16px; --stageBg: linear-gradient(160deg,#131319,#08080c);
}
html[data-theme="m-light"]{
  --bg:#f6f7fb; --panel:#ffffff; --panel2:#eef0f7; --border:#e0e4ee; --input:#f6f7fb;
  --text:#1a1d29; --muted:#7a8195; --muted2:#98a0b3; --accent:#3b82f6; --accentText:#fff;
  --radius:18px; --stageBg: linear-gradient(160deg,#eef1f8,#dfe4ef);
}
html[data-theme="m-neon"]{
  --bg:#07060f; --panel:#100c1f; --panel2:#1a1233; --border:#33235c; --input:#0b0817;
  --text:#e9dcff; --muted:#9a7fd1; --muted2:#6f5a99; --accent:#00e5ff; --accentText:#001318;
  --radius:20px; --stageBg: radial-gradient(circle at 30% 20%, #221043 0%, #05030c 70%);
}
html[data-theme="m-ocean"]{
  --bg:#062033; --panel:#0a2c45; --panel2:#0e3a5a; --border:#155070; --input:#071f31;
  --text:#dff3ff; --muted:#7fb3d0; --muted2:#5a89a3; --accent:#22d3ee; --accentText:#04202b;
  --radius:16px; --stageBg: linear-gradient(180deg,#0a3550,#04141f);
}
html[data-theme="m-sand"]{
  --bg:#f3ece1; --panel:#fffaf3; --panel2:#efe6d8; --border:#e0d3bf; --input:#fbf6ee;
  --text:#3a332b; --muted:#95866f; --muted2:#b0a390; --accent:#0d9488; --accentText:#fff;
  --radius:18px; --stageBg: linear-gradient(180deg,#faf4ea,#e9dfcd);
}

/* ============================================================
   БАЗА
   ============================================================ */
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  font-family: var(--font);
  background: var(--bg); color: var(--text);
  overflow: hidden; -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent;
  transition: background .2s ease, color .2s ease;
}
.app { display: flex; height: 100vh; height: 100dvh; }

/* ---------- Панель ---------- */
.panel {
  width: 316px; flex: 0 0 316px; padding: 16px 16px 40px;
  background: var(--panel); border-right: 1px solid var(--border);
  overflow-y: auto; transition: background .2s, border-color .2s;
  scrollbar-width: thin;
}
.panel-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; gap: 8px; }
.panel h1 { font-size: 17px; margin: 0; font-weight: 700; letter-spacing: .3px; }
.panel h1 span {
  font-size: 10px; background: var(--accent); color: var(--accentText);
  padding: 2px 6px; border-radius: 5px; vertical-align: middle; margin-left: 4px;
}
.device-toggle { display: flex; gap: 3px; background: var(--panel2); padding: 3px; border-radius: 9px; border: 1px solid var(--border); }
.device-toggle button {
  font: inherit; font-size: 13px; line-height: 1; padding: 5px 8px; cursor: pointer;
  background: transparent; border: 0; border-radius: 6px; color: var(--muted);
}
.device-toggle button.active { background: var(--accent); color: var(--accentText); }

section { margin-bottom: 18px; }
.label {
  font-size: 10.5px; text-transform: uppercase; letter-spacing: 1px;
  color: var(--muted); margin-bottom: 8px; font-weight: 700;
}

/* ---------- Палитра ---------- */
.palette { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; }
.swatch {
  aspect-ratio: 1 / 1; width: 100%; padding: 0; border-radius: 4px;
  border: 2px solid rgba(128,128,128,.18); cursor: pointer;
  transition: transform .08s, box-shadow .08s;
}
.swatch:hover { transform: scale(1.18); position: relative; z-index: 2; }
.swatch.active {
  border-color: var(--text);
  box-shadow: 0 0 0 2px var(--accent), 0 0 8px var(--accent);
  transform: scale(1.12); position: relative; z-index: 3;
}
.current {
  display: flex; align-items: center; gap: 10px; margin-top: 10px;
  background: var(--input); padding: 8px 10px; border-radius: 8px;
  border: 1px solid var(--border);
}
.current .chip { width: 26px; height: 26px; border-radius: 6px; border: 1px solid var(--border); }
.current code { font-size: 13px; color: var(--muted); }

/* ---------- Кнопки ---------- */
.tools, .actions, .sizes, .custom, .zoom-controls, .file-row, .scale-row { display: grid; gap: 6px; }
.tools { grid-template-columns: 1fr 1fr; }
.actions { grid-template-columns: 1fr 1fr; }
.sizes { grid-template-columns: repeat(5, 1fr); }
.zoom-controls { grid-template-columns: 40px 1fr 40px 56px; align-items: center; }
.file-row { grid-template-columns: 1fr 1fr; }
.scale-row { grid-template-columns: repeat(4, 1fr); }

button {
  font: inherit; font-size: 12.5px; color: var(--text);
  background: var(--panel2); border: 1px solid var(--border);
  border-radius: 8px; padding: 8px 6px; cursor: pointer;
  transition: background .12s, border-color .12s, color .12s;
}
button:hover { border-color: var(--accent); }
button:active { transform: translateY(1px); }
button.active, button.on {
  background: var(--accent); border-color: var(--accent); color: var(--accentText);
}
button:disabled { opacity: .45; cursor: not-allowed; }

.sizes button { padding: 7px 0; }
.custom { grid-template-columns: 1fr auto 1fr auto; align-items: center; }
.custom input {
  width: 100%; min-width: 0; font: inherit; font-size: 13px;
  background: var(--input); color: var(--text); border: 1px solid var(--border);
  border-radius: 8px; padding: 7px 8px; text-align: center;
}
.custom span { color: var(--muted); font-size: 12px; }
.custom button { padding: 7px 11px; }

#zoomDisplay {
  text-align: center; font-size: 13px; color: var(--muted);
  font-variant-numeric: tabular-nums;
}

.check {
  display: flex; align-items: center; gap: 7px; margin-top: 8px;
  font-size: 12px; color: var(--muted); cursor: pointer;
}
.check input { accent-color: var(--accent); width: 15px; height: 15px; cursor: pointer; }

.hint { font-size: 11px; color: var(--muted2); line-height: 1.5; margin-top: 8px; }
.hint b { color: var(--muted); font-weight: 600; }

/* ---------- Темы ---------- */
.themes { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.theme-btn {
  display: flex; flex-direction: column; align-items: center; gap: 5px;
  padding: 7px 2px 5px; font-size: 9px; color: var(--muted);
  border-radius: 9px; border-width: 2px;
}
.theme-btn .dot { width: 17px; height: 17px; border-radius: 50%; box-shadow: 0 0 0 2px var(--border); }
.theme-btn.active { border-color: var(--accent); color: var(--text); }

/* ---------- Сцена ---------- */
.stage {
  flex: 1; position: relative; display: flex;
  align-items: center; justify-content: center;
  background: var(--stageBg); overflow: hidden; padding: 24px;
  transition: background .25s ease;
}
.canvas-box {
  position: relative; line-height: 0; flex-shrink: 0;
  box-shadow: 0 12px 40px rgba(0,0,0,.5), 0 0 0 1px var(--border);
  background: #fff; will-change: transform;
}
#mainCanvas {
  display: block; image-rendering: pixelated; image-rendering: crisp-edges;
  cursor: crosshair; touch-action: none;
}

/* ---------- Мобильные инструменты ---------- */
.stage-tools {
  position: absolute; right: 10px; top: 10px; z-index: 6;
  display: none; flex-direction: column; gap: 6px;
}
.stage-tools button {
  width: 42px; height: 42px; border-radius: 13px; font-size: 17px;
  background: var(--panel); box-shadow: 0 4px 14px rgba(0,0,0,.28);
}

/* ---------- Док ---------- */
.dock {
  display: none; position: fixed; left: 0; right: 0; bottom: 0; z-index: 25;
  flex-direction: column; gap: 7px;
  padding: 8px 8px calc(8px + env(safe-area-inset-bottom, 0px));
  background: var(--panel); border-top: 1px solid var(--border);
  box-shadow: 0 -8px 28px rgba(0,0,0,.32);
}
.dock-colors { display: flex; gap: 5px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.dock-colors::-webkit-scrollbar { display: none; }
.dock-colors .swatch { flex: 0 0 auto; width: 30px; height: 30px; border-radius: 8px; }
.dock-row { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
.dock-row button { font-size: 18px; padding: 10px 0; border-radius: 13px; line-height: 1; }
.dock-row button.active { background: var(--accent); border-color: var(--accent); color: var(--accentText); }

/* ---------- Тосты ---------- */
.toast {
  position: fixed; left: 50%; bottom: 26px; transform: translate(-50%, 20px);
  background: var(--panel); color: var(--text);
  border: 1px solid var(--border); border-radius: 12px;
  padding: 11px 18px; font-size: 13px; max-width: min(92vw, 520px);
  box-shadow: 0 10px 34px rgba(0,0,0,.45);
  opacity: 0; pointer-events: none; transition: .22s ease; z-index: 100; text-align: center;
  line-height: 1.4;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
html.mobile .toast { bottom: 132px; }

/* ============================================================
   МОБИЛЬНЫЙ РЕЖИМ
   ============================================================ */
html.mobile .app { flex-direction: column; }
html.mobile .stage { padding: 8px 8px 150px; }
html.mobile .panel {
  position: fixed; inset: auto 0 0 0; width: 100%; max-width: 100%;
  flex: none; max-height: 80vh; border-right: 0;
  border-top: 1px solid var(--border);
  border-radius: 22px 22px 0 0;
  transform: translateY(103%);
  transition: transform .3s cubic-bezier(.2,.85,.25,1);
  z-index: 30; padding: 16px 16px calc(96px + env(safe-area-inset-bottom, 0px));
  box-shadow: 0 -14px 44px rgba(0,0,0,.45);
}
html.mobile .panel.open { transform: translateY(0); }
html.mobile .panel::before {
  content: ""; display: block; width: 42px; height: 4px; border-radius: 4px;
  background: var(--border); margin: -6px auto 12px;
}
html.mobile .dock { display: flex; }
html.mobile .stage-tools { display: flex; }
html.mobile .panel h1 { font-size: 16px; }
html.mobile .panel { overscroll-behavior: contain; }
</style>
</head>
<body>
<div class="app">
  <aside class="panel" id="panel">
    <div class="panel-head">
      <h1>Супер Пеинт <span>2.0</span></h1>
      <div class="device-toggle" id="deviceToggle">
        <button data-mode="desktop" title="ПК">💻</button>
        <button data-mode="mobile" title="Телефон">📱</button>
      </div>
    </div>

    <section>
      <div class="label">Палитра — 50 цветов</div>
      <div class="palette" id="palette"></div>
      <div class="current">
        <div class="chip" id="currentChip"></div>
        <code id="currentHex">#000000</code>
      </div>
    </section>

    <section>
      <div class="label">Инструмент</div>
      <div class="tools" id="tools">
        <button data-tool="pencil" class="active">✏️ Карандаш</button>
        <button data-tool="eraser">🧽 Ластик</button>
        <button data-tool="fill">🪣 Заливка</button>
        <button data-tool="picker">💧 Пипетка</button>
      </div>
    </section>

    <section>
      <div class="label">Масштаб просмотра</div>
      <div class="zoom-controls">
        <button id="zoomOut">−</button>
        <span id="zoomDisplay">100%</span>
        <button id="zoomIn">+</button>
        <button id="zoomFit">Fit</button>
      </div>
      <div class="hint"><b>Колесо</b> — зум, <b>пробел+ЛКМ</b> / <b>средняя</b> — панорама.</div>
    </section>

    <section>
      <div class="label">Холст</div>
      <div class="sizes" id="sizes"></div>
      <div class="custom" style="margin-top:6px">
        <input type="number" id="wInput" min="1" value="16">
        <span>×</span>
        <input type="number" id="hInput" min="1" value="16">
        <button id="applySize">OK</button>
      </div>
      <label class="check"><input type="checkbox" id="keepContent" checked> Сохранить рисунок</label>
      <label class="check"><input type="checkbox" id="stretchContent"> Растянуть</label>
      <div class="label" style="margin-top:14px">Масштабировать рисунок</div>
      <div class="scale-row">
        <button data-scale="0.5">÷2</button>
        <button data-scale="2">×2</button>
        <button data-scale="4">×4</button>
        <button data-scale="8">×8</button>
      </div>
    </section>

    <section>
      <div class="label">Файл</div>
      <div class="file-row">
        <button id="exportSave">💾 .paintingsave</button>
        <button id="importBtn">📂 Импорт</button>
      </div>
      <div class="file-row" style="margin-top:6px">
        <button id="saveBtn">⬇ PNG</button>
        <button id="openBtn">🖼 Открыть</button>
      </div>
    </section>

    <section>
      <div class="label" id="themeLabel">Интерфейс</div>
      <div class="themes" id="themes"></div>
    </section>

    <section class="actions">
      <button id="undoBtn">↶ Отменить</button>
      <button id="redoBtn">↷ Повторить</button>
      <button id="clearBtn">🗑 Очистить</button>
      <button id="gridBtn" class="on">▦ Сетка</button>
    </section>

    <section>
      <div class="label">Совместная работа</div>
      <button id="multiplayerBtn" style="width:100%">🌐 P2P Комната</button>
      <div class="hint" id="mpHint">Подключитесь к комнате, чтобы рисовать вместе.</div>
    </section>

    <div class="hint" id="limitHint"></div>
  </aside>

  <main class="stage" id="stage">
    <div class="stage-tools">
      <button id="mZoomIn">+</button>
      <button id="mZoomOut">−</button>
      <button id="mZoomFit">⤢</button>
    </div>
    <div class="canvas-box" id="box">
      <canvas id="mainCanvas"></canvas>
    </div>
  </main>
</div>

<div class="dock" id="dock">
  <div class="dock-colors" id="dockColors"></div>
  <div class="dock-row">
    <button data-tool="pencil" class="active">✏️</button>
    <button data-tool="eraser">🧽</button>
    <button data-tool="fill">🪣</button>
    <button data-tool="picker">💧</button>
    <button id="dockUndo">↶</button>
    <button id="dockMore">⋯</button>
  </div>
</div>

<div class="toast" id="toast"></div>
<input type="file" id="fileInput" accept=".paintingsave,.zip,image/*" hidden>

<!-- ============================================================
     TRYSTERO (CDN, ES-модуль)
     ============================================================ -->
<script type="module">
import { joinRoom } from 'https://cdn.jsdelivr.net/npm/trystero@latest/torrent.min.js';

/* ============================================================
   1. TILE STORE
   ============================================================ */
const TILE = 256;
const MAX_SIDE = 256000;
const UNDO_BUDGET = 128 * 1024 * 1024; // 128 МБ
const MAX_UNDO_STEPS = 80;

class TileStore {
  constructor() {
    this.map = new Map();          // "tx,ty" -> ImageData|null
    this.W = 16; this.H = 16;
    this.cache = new Map();        // key -> {canvas, dirty}
    this.cacheLimit = 180;
    this.undoStack = [];
    this.redoStack = [];
    this.undoBytes = 0;
    this.strokeOld = null;         // Map для текущего штриха
  }

  resize(w, h, keep, stretch, snapshot) {
    this.W = w; this.H = h;
    this.map.clear(); this.cache.clear();
    this.undoStack.length = 0; this.redoStack.length = 0;
    this.undoBytes = 0; this.strokeOld = null;
  }

  worldToTile(x, y) { return [Math.floor(x / TILE), Math.floor(y / TILE)]; }
  tileToWorld(tx, ty) { return [tx * TILE, ty * TILE]; }
  key(tx, ty) { return tx + ',' + ty; }

  getTile(tx, ty) {
    const k = this.key(tx, ty);
    if (this.map.has(k)) {
      const v = this.map.get(k);
      if (v) return v;
    }
    const img = new ImageData(TILE, TILE);
    const d = img.data;
    for (let i = 0; i < d.length; i += 4) { d[i]=255; d[i+1]=255; d[i+2]=255; d[i+3]=255; }
    return img;
  }

  setTile(tx, ty, imageData) {
    const k = this.key(tx, ty);
    if (!imageData) { this.map.set(k, null); this.markDirty(tx, ty); return; }
    let white = true;
    const d = imageData.data;
    for (let i = 0; i < d.length; i += 4) {
      if (d[i] !== 255 || d[i+1] !== 255 || d[i+2] !== 255 || d[i+3] !== 255) { white = false; break; }
    }
    if (white) { this.map.delete(k); }
    else { this.map.set(k, imageData); }
    this.markDirty(tx, ty);
  }

  markDirty(tx, ty) { this.cache.delete(this.key(tx, ty)); }

  getCachedCanvas(tx, ty) {
    const k = this.key(tx, ty);
    let c = this.cache.get(k);
    if (c) return c;
    let img = this.map.get(k) || null;
    if (!img) {
      if (!this.map.has(k)) return null;
      img = this.getTile(tx, ty);
    }
    const canvas = (typeof OffscreenCanvas !== 'undefined')
      ? new OffscreenCanvas(TILE, TILE)
      : Object.assign(document.createElement('canvas'), { width: TILE, height: TILE });
    const ctx = canvas.getContext('2d');
    if (ctx) { ctx.putImageData(img, 0, 0); }
    c = { canvas };
    this.cache.set(k, c);
    if (this.cache.size > this.cacheLimit) {
      const first = this.cache.keys().next().value;
      this.cache.delete(first);
    }
    return c;
  }

  // -------- UNDO --------
  beginStroke() {
    this.strokeOld = new Map();
  }
  recordTile(tx, ty) {
    if (!this.strokeOld) return;
    const k = this.key(tx, ty);
    if (this.strokeOld.has(k)) return;
    const old = this.map.get(k) || null;
    this.strokeOld.set(k, old ? new ImageData(new Uint8ClampedArray(old.data), TILE, TILE) : null);
  }
  endStroke() {
    if (!this.strokeOld || this.strokeOld.size === 0) { this.strokeOld = null; return; }
    const step = { tiles: new Map() };
    for (const [k, old] of this.strokeOld) {
      const [tx, ty] = k.split(',').map(Number);
      const cur = this.map.get(k) || null;
      step.tiles.set(k, { old, cur });
    }
    this.undoStack.push(step);
    this.redoStack.length = 0;
    let bytes = 0;
    for (const {old, cur} of step.tiles.values()) {
      bytes += (old ? old.data.byteLength : 0) + (cur ? cur.data.byteLength : 0);
    }
    this.undoBytes += bytes;
    while ((this.undoBytes > UNDO_BUDGET || this.undoStack.length > MAX_UNDO_STEPS) && this.undoStack.length > 1) {
      const removed = this.undoStack.shift();
      let b = 0;
      for (const {old, cur} of removed.tiles.values()) b += (old?old.data.byteLength:0)+(cur?cur.data.byteLength:0);
      this.undoBytes -= b;
    }
    this.strokeOld = null;
  }

  undo() {
    const step = this.undoStack.pop();
    if (!step) return false;
    const redoStep = { tiles: new Map() };
    for (const [k, { old, cur }] of step.tiles) {
      const [tx, ty] = k.split(',').map(Number);
      redoStep.tiles.set(k, { old: cur, cur: old });
      if (old) this.map.set(k, old); else this.map.delete(k);
      this.markDirty(tx, ty);
    }
    this.redoStack.push(redoStep);
    return true;
  }

  redo() {
    const step = this.redoStack.pop();
    if (!step) return false;
    const undoStep = { tiles: new Map() };
    for (const [k, { old, cur }] of step.tiles) {
      const [tx, ty] = k.split(',').map(Number);
      undoStep.tiles.set(k, { old: cur, cur: old });
      if (cur) this.map.set(k, cur); else this.map.delete(k);
      this.markDirty(tx, ty);
    }
    this.undoStack.push(undoStep);
    return true;
  }
}

/* ============================================================
   2. RENDERER
   ============================================================ */
const mainCanvas = document.getElementById('mainCanvas');
const mainCtx = mainCanvas.getContext('2d');

const Renderer = {
  zoom: 1, panX: 0, panY: 0,
  render() {
    const dpr = window.devicePixelRatio || 1;
    const vw = window.innerWidth, vh = window.innerHeight;
    mainCanvas.width = vw * dpr; mainCanvas.height = vh * dpr;
    mainCanvas.style.width = vw + 'px'; mainCanvas.style.height = vh + 'px';
    mainCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
    mainCtx.imageSmoothingEnabled = false;

    mainCtx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim() || '#0d0f12';
    mainCtx.fillRect(0, 0, vw, vh);

    const store = App.store;
    const z = this.zoom;
    const t0x = Math.floor((-this.panX) / (TILE * z));
    const t0y = Math.floor((-this.panY) / (TILE * z));
    const t1x = Math.floor((vw - this.panX) / (TILE * z));
    const t1y = Math.floor((vh - this.panY) / (TILE * z));

    for (let ty = t0y; ty <= t1y; ty++) {
      for (let tx = t0x; tx <= t1x; tx++) {
        const wx = tx * TILE * z + this.panX;
        const wy = ty * TILE * z + this.panY;
        const size = TILE * z;
        if (wx > vw || wy > vh || wx + size < 0 || wy + size < 0) continue;
        const cached = store.getCachedCanvas(tx, ty);
        if (cached) mainCtx.drawImage(cached.canvas, wx, wy, size, size);
        else { mainCtx.fillStyle = '#fff'; mainCtx.fillRect(wx, wy, size, size); }
      }
    }
  }
};

/* ============================================================
   3. TOOLS (pencil, eraser, fill, picker)
   ============================================================ */
const Tools = {
  putPixel(wx, wy, hex) {
    if (wx < 0 || wy < 0 || wx >= App.store.W || wy >= App.store.H) return;
    const [tx, ty] = App.store.worldToTile(wx, wy);
    const lx = wx % TILE, ly = wy % TILE;
    const img = App.store.getTile(tx, ty);
    const d = img.data;
    const i = (ly * TILE + lx) * 4;
    const [r,g,b] = hexToRgb(hex);
    d[i]=r; d[i+1]=g; d[i+2]=b; d[i+3]=255;
    App.store.setTile(tx, ty, img);
  },
  line(x0, y0, x1, y1, hex) {
    let dx = Math.abs(x1-x0), sx = x0<x1?1:-1;
    let dy = -Math.abs(y1-y0), sy = y0<y1?1:-1;
    let err = dx + dy;
    for (;;) {
      this.putPixel(x0, y0, hex);
      if (x0===x1 && y0===y1) break;
      const e2 = 2*err;
      if (e2 >= dy) { err += dy; x0 += sx; }
      if (e2 <= dx) { err += dx; y0 += sy; }
    }
  },
  floodFill(sx, sy, hex) {
    const store = App.store;
    if (sx<0 || sy<0 || sx>=store.W || sy>=store.H) return;
    const [stx, sty] = store.worldToTile(sx, sy);
    const slx = sx % TILE, sly = sy % TILE;
    const startImg = store.getTile(stx, sty);
    const sd = startImg.data;
    const si = (sly*TILE+slx)*4;
    const target = [sd[si], sd[si+1], sd[si+2]];
    const [nr,ng,nb] = hexToRgb(hex);
    if (target[0]===nr && target[1]===ng && target[2]===nb) return;
    const visited = new Set();
    const queue = [[sx, sy]];
    while (queue.length) {
      const [x, y] = queue.pop();
      if (x<0 || y<0 || x>=store.W || y>=store.H) continue;
      const vk = x+','+y;
      if (visited.has(vk)) continue;
      visited.add(vk);
      const [tx, ty] = store.worldToTile(x, y);
      const lx = x % TILE, ly = y % TILE;
      const img = store.getTile(tx, ty);
      const d = img.data;
      const i = (ly*TILE+lx)*4;
      if (d[i]!==target[0] || d[i+1]!==target[1] || d[i+2]!==target[2]) continue;
      store.recordTile(tx, ty);
      d[i]=nr; d[i+1]=ng; d[i+2]=nb; d[i+3]=255;
      store.setTile(tx, ty, img);
      queue.push([x+1,y],[x-1,y],[x,y+1],[x,y-1]);
    }
  },
  pickColor(wx, wy) {
    const [tx, ty] = App.store.worldToTile(wx, wy);
    const img = App.store.getTile(tx, ty);
    const lx = wx % TILE, ly = wy % TILE;
    const i = (ly*TILE+lx)*4;
    return '#' + [img.data[i], img.data[i+1], img.data[i+2]].map(v=>v.toString(16).padStart(2,'0')).join('');
  }
};

/* ============================================================
   4. FILE I/O (.paintingsave ZIP, PNG, изображения)
   ============================================================ */
const FileIO = {
  async exportSave() {
    const store = App.store;
    const tiles = [];
    for (const [k, img] of store.map) {
      if (!img) continue;
      const [tx, ty] = k.split(',').map(Number);
      const canvas = (typeof OffscreenCanvas !== 'undefined')
        ? new OffscreenCanvas(TILE, TILE)
        : Object.assign(document.createElement('canvas'), { width: TILE, height: TILE });
      const ctx = canvas.getContext('2d');
      ctx.putImageData(img, 0, 0);
      const blob = await canvasToBlob(canvas);
      tiles.push({ name: `tiles/${tx}_${ty}.png`, data: new Uint8Array(await blob.arrayBuffer()) });
    }
    const preview = await this.makePreview();
    const manifest = {
      format: 'paintingsave', version: 2, width: store.W, height: store.H,
      tileSize: TILE, created: new Date().toISOString(), modified: new Date().toISOString(),
      preview
    };
    const files = [
      { name: 'manifest.json', data: new TextEncoder().encode(JSON.stringify(manifest)) },
      ...tiles
    ];
    const zipBlob = await createZip(files);
    downloadBlob(zipBlob, `superpaint_${store.W}x${store.H}.paintingsave`);
    showToast('Файл .paintingsave сохранён', 2000);
  },

  async makePreview() {
    const store = App.store;
    const size = 512;
    const canvas = (typeof OffscreenCanvas !== 'undefined')
      ? new OffscreenCanvas(size, size)
      : Object.assign(document.createElement('canvas'), { width: size, height: size });
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, size, size);
    const scale = Math.min(size / store.W, size / store.H);
    for (const [k, img] of store.map) {
      if (!img) continue;
      const [tx, ty] = k.split(',').map(Number);
      const c = store.getCachedCanvas(tx, ty);
      if (c) ctx.drawImage(c.canvas, tx*TILE*scale, ty*TILE*scale, TILE*scale, TILE*scale);
    }
    const blob = await canvasToBlob(canvas);
    return await blobToDataURL(blob);
  },

  async importSave(file) {
    try {
      const zip = await readZip(file);
      const manifestFile = zip.get('manifest.json');
      if (!manifestFile) throw new Error('Нет manifest.json');
      const manifest = JSON.parse(new TextDecoder().decode(manifestFile));
      if (manifest.format !== 'paintingsave') throw new Error('Неверный формат');
      await App.setSize(manifest.width, manifest.height, false, false);
      const store = App.store;
      for (const [name, data] of zip) {
        if (!name.startsWith('tiles/')) continue;
        const m = name.match(/tiles\/(\d+)_(\d+)\.png/);
        if (!m) continue;
        const tx = +m[1], ty = +m[2];
        const blob = new Blob([data], { type: 'image/png' });
        const img = await createImageBitmap(blob);
        const canvas = (typeof OffscreenCanvas !== 'undefined')
          ? new OffscreenCanvas(TILE, TILE)
          : Object.assign(document.createElement('canvas'), { width: TILE, height: TILE });
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0);
        store.setTile(tx, ty, ctx.getImageData(0, 0, TILE, TILE));
      }
      Renderer.render();
      showToast('Импорт завершён', 2000);
    } catch (e) {
      showToast('Ошибка импорта: ' + e.message, 4000);
    }
  },

  async exportPNG() {
    const store = App.store;
    const canvas = document.createElement('canvas');
    canvas.width = store.W; canvas.height = store.H;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, store.W, store.H);
    for (const [k, img] of store.map) {
      if (!img) continue;
      const [tx, ty] = k.split(',').map(Number);
      const c = store.getCachedCanvas(tx, ty);
      if (c) ctx.drawImage(c.canvas, tx*TILE, ty*TILE);
    }
    canvas.toBlob(blob => downloadBlob(blob, `superpaint_${store.W}x${store.H}.png`));
  },

  async loadImageFile(file) {
    const url = URL.createObjectURL(file);
    try {
      const img = await new Promise((res, rej) => {
        const i = new Image();
        i.onload = () => res(i);
        i.onerror = rej;
        i.src = url;
      });
      await App.setSize(img.naturalWidth, img.naturalHeight, false, false);
      const store = App.store;
      const tmp = document.createElement('canvas');
      tmp.width = store.W; tmp.height = store.H;
      const tctx = tmp.getContext('2d');
      tctx.imageSmoothingEnabled = false;
      tctx.drawImage(img, 0, 0);
      for (let ty = 0; ty < Math.ceil(store.H/TILE); ty++) {
        for (let tx = 0; tx < Math.ceil(store.W/TILE); tx++) {
          const data = tctx.getImageData(tx*TILE, ty*TILE, TILE, TILE);
          store.setTile(tx, ty, data);
        }
      }
      Renderer.render();
      showToast('Изображение загружено', 2000);
    } catch (e) {
      showToast('Не удалось загрузить изображение', 3000);
    } finally { setTimeout(() => URL.revokeObjectURL(url), 3000); }
  }
};

/* ============================================================
   ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ ДЛЯ ZIP / BLOB
   ============================================================ */
function canvasToBlob(canvas) {
  return new Promise(res => {
    if (canvas.convertToBlob) canvas.convertToBlob().then(res);
    else canvas.toBlob(res);
  });
}
function blobToDataURL(blob) {
  return new Promise(res => { const r = new FileReader(); r.onload = () => res(r.result); r.readAsDataURL(blob); });
}
function downloadBlob(blob, name) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}
async function createZip(files) {
  const encoder = new TextEncoder();
  const chunks = [];
  const central = [];
  let offset = 0;
  for (const f of files) {
    const nameBytes = encoder.encode(f.name);
    const crc = crc32(f.data);
    const compressed = await deflateRaw(f.data);
    const useCompressed = compressed.length < f.data.length;
    const data = useCompressed ? compressed : f.data;
    const method = useCompressed ? 8 : 0;

    const local = new Uint8Array(30 + nameBytes.length + data.length);
    const dv = new DataView(local.buffer);
    dv.setUint32(0, 0x04034b50, true);
    dv.setUint16(4, 20, true);
    dv.setUint16(6, 0, true);
    dv.setUint16(8, method, true);
    dv.setUint16(10, 0, true);
    dv.setUint16(12, 0, true);
    dv.setUint32(14, crc, true);
    dv.setUint32(18, data.length, true);
    dv.setUint32(22, f.data.length, true);
    dv.setUint16(26, nameBytes.length, true);
    dv.setUint16(28, 0, true);
    local.set(nameBytes, 30);
    local.set(data, 30 + nameBytes.length);
    chunks.push(local);

    const cen = new Uint8Array(46 + nameBytes.length);
    const cdv = new DataView(cen.buffer);
    cdv.setUint32(0, 0x02014b50, true);
    cdv.setUint16(4, 20, true);
    cdv.setUint16(6, 20, true);
    cdv.setUint16(8, 0, true);
    cdv.setUint16(10, method, true);
    cdv.setUint16(12, 0, true);
    cdv.setUint16(14, 0, true);
    cdv.setUint32(16, crc, true);
    cdv.setUint32(20, data.length, true);
    cdv.setUint32(24, f.data.length, true);
    cdv.setUint16(28, nameBytes.length, true);
    cdv.setUint16(30, 0, true);
    cdv.setUint16(32, 0, true);
    cdv.setUint16(34, 0, true);
    cdv.setUint16(36, 0, true);
    cdv.setUint32(38, 0, true);
    cdv.setUint32(42, offset, true);
    cen.set(nameBytes, 46);
    central.push(cen);
    offset += local.length;
  }
  const centralSize = central.reduce((a, c) => a + c.length, 0);
  const end = new Uint8Array(22);
  const edv = new DataView(end.buffer);
  edv.setUint32(0, 0x06054b50, true);
  edv.setUint16(4, 0, true); edv.setUint16(6, 0, true);
  edv.setUint16(8, files.length, true);
  edv.setUint16(10, files.length, true);
  edv.setUint32(12, centralSize, true);
  edv.setUint32(16, offset, true);
  edv.setUint16(20, 0, true);
  return new Blob([...chunks, ...central, end], { type: 'application/zip' });
}
async function deflateRaw(data) {
  if (typeof CompressionStream === 'undefined') return data;
  const cs = new CompressionStream('deflate-raw');
  const writer = cs.writable.getWriter();
  writer.write(data); writer.close();
  const buf = await new Response(cs.readable).arrayBuffer();
  return new Uint8Array(buf);
}
async function inflateRaw(data) {
  const ds = new DecompressionStream('deflate-raw');
  const writer = ds.writable.getWriter();
  writer.write(data); writer.close();
  const buf = await new Response(ds.readable).arrayBuffer();
  return new Uint8Array(buf);
}
function crc32(data) {
  let c, crc = 0xFFFFFFFF;
  for (let i = 0; i < data.length; i++) {
    c = (crc ^ data[i]) & 0xFF;
    for (let j = 0; j < 8; j++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    crc = (crc >>> 8) ^ c;
  }
  return (crc ^ 0xFFFFFFFF) >>> 0;
}
async function readZip(blob) {
  const buf = await blob.arrayBuffer();
  const dv = new DataView(buf);
  let eocd = -1;
  for (let i = buf.byteLength - 22; i >= 0; i--) {
    if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  }
  if (eocd < 0) throw new Error('Не ZIP-архив');
  const count = dv.getUint16(eocd + 8, true);
  let pos = dv.getUint32(eocd + 16, true);
  const map = new Map();
  for (let i = 0; i < count; i++) {
    if (dv.getUint32(pos, true) !== 0x02014b50) break;
    const nameLen = dv.getUint16(pos + 28, true);
    const extraLen = dv.getUint16(pos + 30, true);
    const commentLen = dv.getUint16(pos + 32, true);
    const localOffset = dv.getUint32(pos + 42, true);
    const name = new TextDecoder().decode(new Uint8Array(buf, pos + 46, nameLen));
    const method = dv.getUint16(pos + 10, true);
    const compSize = dv.getUint32(pos + 20, true);

    const lnLen = dv.getUint16(localOffset + 26, true);
    const leLen = dv.getUint16(localOffset + 28, true);
    const dataStart = localOffset + 30 + lnLen + leLen;
    let raw = new Uint8Array(buf, dataStart, compSize);
    let out;
    if (method === 8) out = await inflateRaw(raw);
    else if (method === 0) out = raw;
    else throw new Error('Неподдерживаемый метод сжатия: ' + method);
    map.set(name, out);
    pos += 46 + nameLen + extraLen + commentLen;
  }
  return map;
}
function hexToRgb(hex) {
  const h = hex.replace('#','');
  return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)];
}

   5. MULTIPLAYER (Trystero)

const Multiplayer = {
  room: null, peerId: null, peers: new Map(),
  sendTile: null, getTile: null, sendCursor: null, getCursor: null,
  color: '#' + Math.floor(Math.random()*16777215).toString(16).padStart(6,'0'),
  name: 'Пользователь-' + Math.floor(Math.random()*1000),

  async join(roomCode) {
    if (!roomCode) return;
    try {
      this.room = joinRoom({ appId: 'superpaint-v2' }, roomCode);
      [this.sendTile, this.getTile] = this.room.makeAction('tile');
      [this.sendCursor, this.getCursor] = this.room.makeAction('cursor');

      this.room.onPeerJoin(peer => {
        this.peers.set(peer, { name: 'Пир-' + peer.slice(0,4), color: this.color });
        showToast('Подключён пир: ' + peer.slice(0,6), 2000);
        this.sendTile({ type: 'sync-request' });
      });
      this.room.onPeerLeave(peer => { this.peers.delete(peer); });

      this.getTile((data, peer) => {
        if (!data) return;
        if (data.type === 'tile') {
          const img = new ImageData(new Uint8ClampedArray(data.data), TILE, TILE);
          App.store.setTile(data.tx, data.ty, img);
          Renderer.render();
        }
        if (data.type === 'sync-request') {
          for (const [k, img] of App.store.map) {
            if (!img) continue;
            const [tx, ty] = k.split(',').map(Number);
            this.sendTile({ type: 'tile', tx, ty, data: img.data.buffer }, peer);
          }
        }
      });

      this.getCursor((data, peer) => {
        if (!this.peers.has(peer)) return;
        this.peers.get(peer).x = data.x;
        this.peers.get(peer).y = data.y;
      });

      setInterval(() => {
        if (this.sendCursor && App.mouseWorld) {
          this.sendCursor({ x: App.mouseWorld.x, y: App.mouseWorld.y, color: this.color, name: this.name });
        }
      }, 50);
      showToast('Комната: ' + roomCode, 3000);
    } catch (e) {
      showToast('Не удалось подключиться: ' + e.message, 4000);
    }
  },

  sendTileChange(tx, ty, img) {
    if (!this.sendTile) return;
    this.sendTile({ type: 'tile', tx, ty, data: img.data.buffer });
  }
};

      for (const [k, img] of this.store.map) {
        if (!img) continue;
        const [tx, ty] = k.split(',').map(Number);
        const c = this.store.getCachedCanvas(tx, ty);
        if (c) sctx.drawImage(c.canvas, tx*TILE, ty*TILE);
      }
    }
    this.store.resize(w, h, keep, stretch, snapshot);
    if (snapshot) {
      const tmp = document.createElement('canvas');
      tmp.width = w; tmp.height = h;
      const tctx = tmp.getContext('2d');
      tctx.imageSmoothingEnabled = false;
      if (stretch) tctx.drawImage(snapshot, 0, 0, w, h);
      else tctx.drawImage(snapshot, 0, 0);
      for (let ty = 0; ty < Math.ceil(h/TILE); ty++) {
        for (let tx = 0; tx < Math.ceil(w/TILE); tx++) {
          const data = tctx.getImageData(tx*TILE, ty*TILE, TILE, TILE);
          this.store.setTile(tx, ty, data);
        }
      }
    }
    document.getElementById('wInput').value = w;
    document.getElementById('hInput').value = h;
    Renderer.render();
  },

  bindEvents() {
    const canvas = mainCanvas;

    canvas.addEventListener('pointerdown', e => {
      if (spaceDown || e.button === 1) return;
      if (e.button !== 0 && e.pointerType === 'mouse') return;
      const rect = canvas.getBoundingClientRect();
      const wx = Math.floor((e.clientX - rect.left - Renderer.panX) / Renderer.zoom);
      const wy = Math.floor((e.clientY - rect.top - Renderer.panY) / Renderer.zoom);
      if (wx < 0 || wy < 0 || wx >= App.store.W || wy >= App.store.H) return;
      if (tool === 'picker') { selectColor(Tools.pickColor(wx, wy)); setTool('pencil'); return; }
      canvas.setPointerCapture(e.pointerId);
      e.preventDefault();
      App.store.beginStroke();
      if (tool === 'fill') { Tools.floodFill(wx, wy, currentColor); App.store.endStroke(); return; }
      drawing = true; lastWorld = { x: wx, y: wy };
      Tools.putPixel(wx, wy, tool === 'eraser' ? '#ffffff' : currentColor);
      App.store.recordTile(...App.store.worldToTile(wx, wy));
    });

    canvas.addEventListener('pointermove', e => {
      const rect = canvas.getBoundingClientRect();
      const wx = Math.floor((e.clientX - rect.left - Renderer.panX) / Renderer.zoom);
      const wy = Math.floor((e.clientY - rect.top - Renderer.panY) / Renderer.zoom);
      App.mouseWorld = { x: wx, y: wy };
      if (!drawing || !lastWorld) return;
      const color = tool === 'eraser' ? '#ffffff' : currentColor;
      Tools.line(lastWorld.x, lastWorld.y, wx, wy, color);
      lastWorld = { x: wx, y: wy };
      Multiplayer.sendTileChange(...App.store.worldToTile(wx, wy), App.store.getTile(...App.store.worldToTile(wx, wy)));
    });

    const endStroke = () => {
      if (!drawing) return;
      drawing = false; lastWorld = null;
      App.store.endStroke();
      Multiplayer.sendTileChange(0,0,null); // сигнал обновления (упрощённо)
    };
    canvas.addEventListener('pointerup', endStroke);
    canvas.addEventListener('pointercancel', endStroke);

    // Панорама
    canvas.addEventListener('pointerdown', e => {
      if (e.button === 1 || (e.button === 0 && spaceDown)) {
        isPanning = true;
        panStart = { x: e.clientX - Renderer.panX, y: e.clientY - Renderer.panY };
        canvas.setPointerCapture(e.pointerId);
        e.preventDefault();
      }
    });
    canvas.addEventListener('pointermove', e => {
      if (!isPanning || !panStart) return;
      Renderer.panX = e.clientX - panStart.x;
      Renderer.panY = e.clientY - panStart.y;
      Renderer.render();
    });
    const endPan = () => { isPanning = false; panStart = null; };
    canvas.addEventListener('pointerup', endPan);
    canvas.addEventListener('pointercancel', endPan);

    // Зум
    canvas.addEventListener('wheel', e => {
      e.preventDefault();
      const f = Math.exp(-e.deltaY * 0.0018);
      const newZoom = Math.min(128, Math.max(0.01, Renderer.zoom * f));
      const rect = canvas.getBoundingClientRect();
      const mx = e.clientX - rect.left, my = e.clientY - rect.top;
      Renderer.panX = mx - (mx - Renderer.panX) * (newZoom / Renderer.zoom);
      Renderer.panY = my - (my - Renderer.panY) * (newZoom / Renderer.zoom);
      Renderer.zoom = newZoom;
      document.getElementById('zoomDisplay').textContent = Math.round(Renderer.zoom * 100) + '%';
      Renderer.render();
    }, { passive: false });

    // Клавиатура
    window.addEventListener('keydown', e => {
      if (e.target.tagName === 'INPUT') return;
      if (e.code === 'Space') { spaceDown = true; e.preventDefault(); return; }
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); App.store.undo(); Renderer.render(); return; }
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y') { e.preventDefault(); App.store.redo(); Renderer.render(); return; }
      if (e.ctrlKey || e.metaKey) return;
      switch (e.key.toLowerCase()) {
        case 'b': setTool('pencil'); break;
        case 'e': setTool('eraser'); break;
        case 'g': setTool('fill'); break;
        case 'i': setTool('picker'); break;
        case '0': fitScreen(); break;
        case '+': case '=': zoomIn(); break;
        case '-': case '_': zoomOut(); break;
      }
    });
    window.addEventListener('keyup', e => { if (e.code === 'Space') spaceDown = false; });

    // Кнопки
    document.getElementById('zoomIn').onclick = zoomIn;
    document.getElementById('zoomOut').onclick = zoomOut;
    document.getElementById('zoomFit').onclick = fitScreen;
    document.getElementById('undoBtn').onclick = () => { App.store.undo(); Renderer.render(); };
    document.getElementById('redoBtn').onclick = () => { App.store.redo(); Renderer.render(); };
    document.getElementById('clearBtn').onclick = () => { App.store.resize(App.store.W, App.store.H, false, false); Renderer.render(); };
    document.getElementById('exportSave').onclick = () => FileIO.exportSave();
    document.getElementById('saveBtn').onclick = () => FileIO.exportPNG();
    document.getElementById('importBtn').onclick = () => document.getElementById('fileInput').click();
    document.getElementById('openBtn').onclick = () => document.getElementById('fileInput').click();
    document.getElementById('fileInput').onchange = e => {
      const f = e.target.files[0];
      if (!f) return;
      if (f.name.endsWith('.paintingsave') || f.name.endsWith('.zip')) FileIO.importSave(f);
      else if (f.type.startsWith('image/')) FileIO.loadImageFile(f);
    };
    document.getElementById('applySize').onclick = () => {
      App.setSize(+document.getElementById('wInput').value, +document.getElementById('hInput').value,
        document.getElementById('keepContent').checked, document.getElementById('stretchContent').checked);
    };
    document.querySelectorAll('[data-scale]').forEach(b => {
      b.onclick = () => {
        const f = parseFloat(b.dataset.scale);
        App.setSize(Math.round(App.store.W*f), Math.round(App.store.H*f), true, true);
      };
    });
    document.querySelectorAll('#tools button[data-tool]').forEach(b => b.onclick = () => setTool(b.dataset.tool));
    document.querySelectorAll('.dock-row button[data-tool]').forEach(b => b.onclick = () => setTool(b.dataset.tool));
    document.getElementById('multiplayerBtn').onclick = () => {
      const code = prompt('Код комнаты (любая строка):');
      if (code) Multiplayer.join(code);
    };
    document.getElementById('deviceToggle').onclick = e => {
      const b = e.target.closest('button[data-mode]');
      if (b) App.setMode(b.dataset.mode);
    };
  },

  setMode(m) {
    mode = m;
    document.documentElement.classList.toggle('mobile', m === 'mobile');
    localStorage.setItem('sp-mode', m);
    document.querySelectorAll('#deviceToggle button').forEach(b => b.classList.toggle('active', b.dataset.mode === m));
    themeId = localStorage.getItem('sp-theme-' + m) || THEMES[m][0].id;
    applyTheme(themeId);
    if (m !== 'mobile') document.getElementById('panel').classList.remove('open');
    else document.getElementById('panel').classList.add('open');
  },

  loadMode() {
    const saved = localStorage.getItem('sp-mode');
    const m = saved || (matchMedia('(pointer:coarse)').matches ? 'mobile' : 'desktop');
    this.setMode(m);
  },

  startAutoSave() {
    setInterval(() => {
      try {
        const data = JSON.stringify({
          W: this.store.W, H: this.store.H,
          tiles: Array.from(this.store.map.entries()).map(([k, img]) => [k, img ? Array.from(img.data) : null])
        });
        localStorage.setItem('sp-autosave', data);
      } catch (e) {}
    }, 30000);
  },

  loop() {
    Renderer.render();
    requestAnimationFrame(() => this.loop());
  }
};

/* ============================================================
   ФУНКЦИИ UI
   ============================================================ */
function selectColor(hex) {
  currentColor = hex;
  document.getElementById('currentChip').style.background = hex;
  document.getElementById('currentHex').textContent = hex;
  document.querySelectorAll('.swatch').forEach(el => el.classList.toggle('active', el.dataset.color === hex));
}
function setTool(t) {
  tool = t;
  document.querySelectorAll('[data-tool]').forEach(b => b.classList.toggle('active', b.dataset.tool === t));
}
function applyTheme(id) {
  themeId = id;
  document.documentElement.dataset.theme = id;
  localStorage.setItem('sp-theme-' + mode, id);
  App.buildThemes();
}
function zoomIn() {
  Renderer.zoom = Math.min(128, Renderer.zoom * 1.5);
  document.getElementById('zoomDisplay').textContent = Math.round(Renderer.zoom * 100) + '%';
  Renderer.render();
}
function zoomOut() {
  Renderer.zoom = Math.max(0.01, Renderer.zoom / 1.5);
  document.getElementById('zoomDisplay').textContent = Math.round(Renderer.zoom * 100) + '%';
  Renderer.render();
}
function fitScreen() {
  const vw = window.innerWidth, vh = window.innerHeight;
  Renderer.zoom = Math.min(vw / App.store.W, vh / App.store.H) * 0.9;
  Renderer.panX = (vw - App.store.W * Renderer.zoom) / 2;
  Renderer.panY = (vh - App.store.H * Renderer.zoom) / 2;
  document.getElementById('zoomDisplay').textContent = Math.round(Renderer.zoom * 100) + '%';
  Renderer.render();
}

/* ============================================================
   СТАРТ
   ============================================================ */
App.init().then(() => {
  fitScreen();
  showToast('Супер Пеинт 2.0 — тайловый холст готов', 2500);
});
</script>
