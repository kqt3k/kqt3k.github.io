<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Супер Пеинт 1.0</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #14161a; color: #e6e8ec; overflow: hidden;
    -webkit-user-select: none; user-select: none;
  }
  .app { display: flex; height: 100vh; }

  /* ---------- Панель ---------- */
  .panel {
    width: 310px; flex: 0 0 310px; padding: 16px 16px 40px;
    background: #1b1e24; border-right: 1px solid #2a2f38;
    overflow-y: auto;
  }
  .panel h1 {
    font-size: 18px; margin: 0 0 18px; font-weight: 700; letter-spacing: .3px;
  }
  .panel h1 span {
    font-size: 11px; background: #2f6fed; color: #fff; padding: 2px 6px;
    border-radius: 5px; vertical-align: middle; margin-left: 4px;
  }
  section { margin-bottom: 20px; }
  .label {
    font-size: 11px; text-transform: uppercase; letter-spacing: 1px;
    color: #7c8595; margin-bottom: 8px; font-weight: 600;
  }

  /* ---------- Палитра ---------- */
  .palette {
    display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px;
  }
  .swatch {
    aspect-ratio: 1 / 1; width: 100%; padding: 0; border-radius: 4px;
    border: 2px solid rgba(255,255,255,.08); cursor: pointer;
    transition: transform .08s, box-shadow .08s;
  }
  .swatch:hover { transform: scale(1.15); z-index: 2; position: relative; }
  .swatch.active {
    border-color: #fff;
    box-shadow: 0 0 0 2px #2f6fed, 0 0 8px rgba(47,111,237,.9);
    transform: scale(1.1); position: relative; z-index: 3;
  }

  .current {
    display: flex; align-items: center; gap: 10px; margin-top: 10px;
    background: #14161a; padding: 8px 10px; border-radius: 8px;
    border: 1px solid #2a2f38;
  }
  .current .chip {
    width: 26px; height: 26px; border-radius: 6px;
    border: 1px solid rgba(255,255,255,.15);
  }
  .current code { font-size: 13px; color: #9aa4b5; }

  /* ---------- Инструменты ---------- */
  .tools { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .tools button, .actions button, .sizes button, .custom button, .zoom-controls button {
    font: inherit; font-size: 12.5px; color: #cfd6e2;
    background: #23272f; border: 1px solid #2f3540; border-radius: 7px;
    padding: 8px 6px; cursor: pointer; transition: .12s;
  }
  .tools button:hover, .actions button:hover,
  .sizes button:hover, .custom button:hover,
  .zoom-controls button:hover { background: #2c313b; }
  .tools button.active, .sizes button.active {
    background: #2f6fed; border-color: #2f6fed; color: #fff;
  }

  /* ---------- Зум ---------- */
  .zoom-controls {
    display: flex; align-items: center; gap: 6px;
  }
  .zoom-controls button { min-width: 34px; padding: 7px 10px; font-size: 14px; }
  .zoom-controls #zoomDisplay {
    flex: 1; text-align: center; font-size: 13px; color: #9aa4b5;
    font-variant-numeric: tabular-nums; user-select: none;
  }
  .zoom-controls #zoomFit { font-size: 11.5px; padding: 7px 8px; min-width: 0; }

  /* ---------- Размер ---------- */
  .sizes { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
  .sizes button { padding: 7px 0; }
  .custom { display: flex; align-items: center; gap: 6px; margin-top: 8px; }
  .custom input {
    width: 100%; min-width: 0; font: inherit; font-size: 13px;
    background: #14161a; color: #e6e8ec; border: 1px solid #2f3540;
    border-radius: 7px; padding: 6px 8px; text-align: center;
  }
  .custom span { color: #7c8595; }
  .custom button { padding: 6px 10px; flex: 0 0 auto; }

  /* ---------- Действия ---------- */
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .actions button.on { background: #2f6fed; border-color: #2f6fed; color: #fff; }

  .hint { font-size: 11px; color: #5f6878; line-height: 1.5; margin-top: 6px; }
  .hint b { color: #8b94a5; font-weight: 600; }

  /* ---------- Сцена ---------- */
  .stage {
    flex: 1; position: relative;
    display: flex; align-items: center; justify-content: center;
    background:
      radial-gradient(circle at 50% 40%, #1a1d23 0%, #0d0f12 100%);
    overflow: hidden; padding: 24px;
  }
  .canvas-box {
    position: relative; line-height: 0; flex-shrink: 0;
    box-shadow: 0 12px 40px rgba(0,0,0,.65), 0 0 0 1px #2a2f38;
    background: #fff;
    will-change: transform;
  }
  #board {
    display: block; image-rendering: pixelated;
    image-rendering: crisp-edges;
    cursor: crosshair; touch-action: none;
  }
  #gridCanvas {
    position: absolute; left: 0; top: 0; pointer-events: none;
  }
</style>
</head>
<body>
<div class="app">
  <aside class="panel">
    <h1>Супер Пеинт <span>1.0</span></h1>

    <section>
      <div class="label">Палитра — 50 цветов</div>
      <div class="palette" id="palette"></div>
      <div class="current">
        <div class="chip" id="currentChip"></div>
        <code id="currentHex">#000000</code>
      </div>
    </section>

    <section>
      <div class="label">Инструмент</div>
      <div class="tools" id="tools">
        <button data-tool="pencil" class="active">✏️ Карандаш</button>
        <button data-tool="eraser">🧽 Ластик</button>
        <button data-tool="fill">🪣 Заливка</button>
        <button data-tool="picker">💧 Пипетка</button>
      </div>
    </section>

    <section>
      <div class="label">Масштаб</div>
      <div class="zoom-controls">
        <button id="zoomOut" title="Уменьшить (−)">−</button>
        <span id="zoomDisplay">100%</span>
        <button id="zoomIn" title="Увеличить (+)">+</button>
        <button id="zoomFit" title="Вписать в экран (0)">Fit</button>
      </div>
      <div class="hint">
        <b>Колесо мыши</b> — зум к курсору.<br>
        <b>Пробел + перетаскивание</b> или <b>средняя кнопка</b> — панорама.<br>
        Клавиши <b>+</b> / <b>−</b> / <b>0</b> тоже работают.
      </div>
    </section>

    <section>
      <div class="label">Размер холста</div>
      <div class="sizes" id="sizes"></div>
      <div class="custom">
        <input type="number" id="wInput" min="1" max="256" value="16">
        <span>×</span>
        <input type="number" id="hInput" min="1" max="256" value="16">
        <button id="applySize">OK</button>
      </div>
      <div class="hint">Маленькие холсты (16×16, 32×32) автоматически увеличиваются — рисуешь по пикселям.</div>
    </section>

    <section class="actions">
      <button id="undoBtn">↶ Отменить</button>
      <button id="clearBtn">🗑 Очистить</button>
      <button id="gridBtn" class="on">▦ Сетка</button>
      <button id="saveBtn">⬇ PNG</button>
    </section>
  </aside>

  <main class="stage" id="stage">
    <div class="canvas-box" id="box">
      <canvas id="board"></canvas>
      <canvas id="gridCanvas"></canvas>
    </div>
  </main>
</div>

<script>
(() => {
  "use strict";

  /* ======================== ПАЛИТРА (ровно 50) ======================== */
  const PALETTE = [
    '#000000', '#333333', '#666666', '#999999', '#cccccc', '#ffffff',
    '#7f0000', '#b30000', '#ff0000', '#ff4d4d', '#ff9999', '#ff0066', '#ff66a3',
    '#7f3f00', '#b35900', '#ff8000', '#ffb366', '#f4a460', '#8b5a2b', '#5a3d2b', '#2b1d14',
    '#7f7f00', '#ffff00', '#ffff66', '#ffe699', '#ffd700', '#c9a227',
    '#003300', '#006600', '#00b300', '#00ff00', '#66ff66', '#99ff99', '#00ff7f', '#7fff7f',
    '#00ffff', '#66ffff', '#00bfff', '#0066cc', '#0000ff', '#6666ff', '#000080', '#7f7fff',
    '#330066', '#6600cc', '#9933ff', '#cc66ff', '#ff00ff', '#ff66ff', '#7f007f'
  ];

  const SIZES = [8, 16, 24, 32, 48];

  /* ======================== ЭЛЕМЕНТЫ ======================== */
  const board   = document.getElementById('board');
  const ctx     = board.getContext('2d', { willReadFrequently: true });
  const gridCv  = document.getElementById('gridCanvas');
  const gctx    = gridCv.getContext('2d');
  const stage   = document.getElementById('stage');
  const box     = document.getElementById('box');
  const paletteEl = document.getElementById('palette');
  const sizesEl   = document.getElementById('sizes');
  const toolsEl   = document.getElementById('tools');
  const chipEl    = document.getElementById('currentChip');
  const hexEl     = document.getElementById('currentHex');
  const wInput    = document.getElementById('wInput');
  const hInput    = document.getElementById('hInput');
  const zoomDisplay = document.getElementById('zoomDisplay');

  /* ======================== СОСТОЯНИЕ ======================== */
  let W = 16, H = 16;
  let scale = 20;
  let currentColor = '#000000';
  let tool = 'pencil';
  let showGrid = true;

  // зум
  let zoom = 1;            // множитель к «fit»-масштабу
  let panX = 0, panY = 0;  // сдвиг в пикселях
  let spaceDown = false;
  let isPanning = false;
  let panStart = null;

  // рисование
  let drawing = false;
  let lastPt = null;

  const undoStack = [];
  const MAX_UNDO = 80;

  /* ======================== УТИЛИТЫ ======================== */
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  function hexToRgb(hex) {
    const h = hex.replace('#', '');
    return [
      parseInt(h.slice(0, 2), 16),
      parseInt(h.slice(2, 4), 16),
      parseInt(h.slice(4, 6), 16)
    ];
  }

  function activeColor() {
    return tool === 'eraser' ? '#ffffff' : currentColor;
  }

  function putPixel(x, y, color) {
    if (x < 0 || y < 0 || x >= W || y >= H) return;
    ctx.fillStyle = color;
    ctx.fillRect(x, y, 1, 1);
  }

  function bresenham(x0, y0, x1, y1, cb) {
    let dx = Math.abs(x1 - x0), sx = x0 < x1 ? 1 : -1;
    let dy = -Math.abs(y1 - y0), sy = y0 < y1 ? 1 : -1;
    let err = dx + dy;
    for (;;) {
      cb(x0, y0);
      if (x0 === x1 && y0 === y1) break;
      const e2 = 2 * err;
      if (e2 >= dy) { err += dy; x0 += sx; }
      if (e2 <= dx) { err += dx; y0 += sy; }
    }
  }

  /* ======================== МАСШТАБ ======================== */
  // ограничитель размера сетки: не более 16M пикселей (~64 МБ)
  function maxAllowedScale() {
    const gridBudget = 16e6;
    const byArea = Math.sqrt(gridBudget / (W * H));
    return Math.max(8, Math.min(128, byArea));
  }

  function computeScale() {
    const pad = 48;
    const availW = Math.max(40, stage.clientWidth - pad);
    const availH = Math.max(40, stage.clientHeight - pad);
    const baseScale = Math.min(availW / W, availH / H);
    let s = baseScale * zoom;
    if (s >= 1) s = Math.floor(s);
    s = Math.max(0.05, Math.min(s, maxAllowedScale()));
    return s;
  }

  function clampPan() {
    const maxPanX = Math.max(0, (W * scale - stage.clientWidth) / 2);
    const maxPanY = Math.max(0, (H * scale - stage.clientHeight) / 2);
    panX = clamp(panX, -maxPanX, maxPanX);
    panY = clamp(panY, -maxPanY, maxPanY);
  }

  function layout() {
    scale = computeScale();
    clampPan();

    const dw = Math.round(W * scale);
    const dh = Math.round(H * scale);

    board.style.width  = dw + 'px';
    board.style.height = dh + 'px';

    gridCv.width  = dw;
    gridCv.height = dh;
    gridCv.style.width  = dw + 'px';
    gridCv.style.height = dh + 'px';

    box.style.transform = `translate(${panX}px, ${panY}px)`;

    drawGrid();
    updateZoomUI();
    updateCursor();
  }

  function drawGrid() {
    gctx.clearRect(0, 0, gridCv.width, gridCv.height);
    if (!showGrid || scale < 4) return;

    gctx.strokeStyle = 'rgba(0,0,0,0.22)';
    gctx.lineWidth = 1;
    gctx.beginPath();
    for (let x = 1; x < W; x++) {
      const px = Math.round(x * scale) + 0.5;
      gctx.moveTo(px, 0);
      gctx.lineTo(px, gridCv.height);
    }
    for (let y = 1; y < H; y++) {
      const py = Math.round(y * scale) + 0.5;
      gctx.moveTo(0, py);
      gctx.lineTo(gridCv.width, py);
    }
    gctx.stroke();
  }

  function updateZoomUI() {
    zoomDisplay.textContent = Math.round(zoom * 100) + '%';
  }

  function setZoom(newZoom, cursorX, cursorY) {
    newZoom = clamp(newZoom, 0.25, 32);
    if (Math.abs(newZoom - zoom) < 0.001) return;

    const stageRect = stage.getBoundingClientRect();
    const stageCX = stageRect.left + stageRect.width  / 2;
    const stageCY = stageRect.top  + stageRect.height / 2;

    if (cursorX === undefined) {
      cursorX = stageCX + panX;
      cursorY = stageCY + panY;
    }

    const oldScale = scale;
    const originX = stageCX - (W * oldScale) / 2 + panX;
    const originY = stageCY - (H * oldScale) / 2 + panY;

    const canvasPx = (cursorX - originX) / oldScale;
    const canvasPy = (cursorY - originY) / oldScale;

    zoom = newZoom;
    const newScale = computeScale();

    panX = cursorX - stageCX + (W * newScale) / 2 - canvasPx * newScale;
    panY = cursorY - stageCY + (H * newScale) / 2 - canvasPy * newScale;

    layout();
  }

  function zoomFromCenter(factor) {
    const stageRect = stage.getBoundingClientRect();
    const cx = stageRect.left + stageRect.width  / 2 + panX;
    const cy = stageRect.top  + stageRect.height / 2 + panY;
    setZoom(zoom * factor, cx, cy);
  }

  function fitToScreen() {
    zoom = 1; panX = 0; panY = 0;
    layout();
  }

  /* ======================== UNDO ======================== */
  function pushUndo() {
    try {
      undoStack.push(ctx.getImageData(0, 0, W, H));
      if (undoStack.length > MAX_UNDO) undoStack.shift();
    } catch (e) { /* ignore */ }
  }

  function undo() {
    const snapshot = undoStack.pop();
    if (!snapshot) return;
    ctx.putImageData(snapshot, 0, 0);
  }

  /* ======================== ЗАЛИВКА ======================== */
  function floodFill(x, y, hex) {
    if (x < 0 || y < 0 || x >= W || y >= H) return;

    const img = ctx.getImageData(0, 0, W, H);
    const d = img.data;
    const start = (y * W + x) * 4;
    const tr = d[start], tg = d[start + 1], tb = d[start + 2];
    const [nr, ng, nb] = hexToRgb(hex);
    if (tr === nr && tg === ng && tb === nb) return;

    const stack = [x, y];
    while (stack.length) {
      const cy = stack.pop();
      const cx = stack.pop();
      if (cx < 0 || cy < 0 || cx >= W || cy >= H) continue;
      const i = (cy * W + cx) * 4;
      if (d[i] !== tr || d[i + 1] !== tg || d[i + 2] !== tb) continue;
      d[i] = nr; d[i + 1] = ng; d[i + 2] = nb; d[i + 3] = 255;
      stack.push(cx + 1, cy, cx - 1, cy, cx, cy + 1, cx, cy - 1);
    }
    ctx.putImageData(img, 0, 0);
  }

  /* ======================== КООРДИНАТЫ ======================== */
  function getPos(e) {
    const r = board.getBoundingClientRect();
    return {
      x: Math.floor((e.clientX - r.left) / r.width  * W),
      y: Math.floor((e.clientY - r.top)  / r.height * H)
    };
  }

  /* ======================== РИСОВАНИЕ ======================== */
  board.addEventListener('pointerdown', (e) => {
    // панорама или средняя кнопка — отдаём событие сцене
    if (spaceDown || e.button === 1) return;
    if (e.button !== 0 && e.pointerType === 'mouse') return;

    const p = getPos(e);
    if (p.x < 0 || p.y < 0 || p.x >= W || p.y >= H) return;

    if (tool === 'picker') { pickColorAt(p.x, p.y); return; }

    board.setPointerCapture(e.pointerId);
    e.preventDefault();
    pushUndo();

    if (tool === 'fill') { floodFill(p.x, p.y, currentColor); return; }

    drawing = true;
    lastPt = p;
    putPixel(p.x, p.y, activeColor());
  });

  board.addEventListener('pointermove', (e) => {
    if (!drawing || !lastPt) return;
    const p = getPos(e);
    const cx = clamp(p.x, -1, W);
    const cy = clamp(p.y, -1, H);
    const color = activeColor();
    bresenham(lastPt.x, lastPt.y, cx, cy, (x, y) => putPixel(x, y, color));
    lastPt = { x: cx, y: cy };
  });

  function endStroke(e) {
    if (!drawing) return;
    drawing = false;
    lastPt = null;
    if (e && e.pointerId !== undefined && board.hasPointerCapture(e.pointerId)) {
      board.releasePointerCapture(e.pointerId);
    }
  }
  board.addEventListener('pointerup', endStroke);
  board.addEventListener('pointercancel', endStroke);
  board.addEventListener('contextmenu', (e) => e.preventDefault());

  /* ======================== ПАНОРАМА ======================== */
  stage.addEventListener('pointerdown', (e) => {
    const wantPan = (e.button === 1) || (e.button === 0 && spaceDown);
    if (!wantPan) return;
    e.preventDefault();
    isPanning = true;
    panStart = { x: e.clientX - panX, y: e.clientY - panY };
    stage.setPointerCapture(e.pointerId);
    updateCursor();
  });

  stage.addEventListener('pointermove', (e) => {
    if (!isPanning || !panStart) return;
    panX = e.clientX - panStart.x;
    panY = e.clientY - panStart.y;
    clampPan();
    box.style.transform = `translate(${panX}px, ${panY}px)`;
  });

  function endPan(e) {
    if (!isPanning) return;
    isPanning = false;
    panStart = null;
    if (e && e.pointerId !== undefined && stage.hasPointerCapture(e.pointerId)) {
      stage.releasePointerCapture(e.pointerId);
    }
    updateCursor();
  }
  stage.addEventListener('pointerup', endPan);
  stage.addEventListener('pointercancel', endPan);

  function updateCursor() {
    if (isPanning) board.style.cursor = 'grabbing';
    else if (spaceDown) board.style.cursor = 'grab';
    else if (tool === 'picker') board.style.cursor = 'copy';
    else board.style.cursor = 'crosshair';
  }

  /* ======================== КОЛЕСО ======================== */
  stage.addEventListener('wheel', (e) => {
    if (e.target.tagName === 'INPUT') return;
    e.preventDefault();
    const factor = Math.exp(-e.deltaY * 0.0018);
    setZoom(zoom * factor, e.clientX, e.clientY);
  }, { passive: false });

  /* ======================== ПИПЕТКА ======================== */
  function pickColorAt(x, y) {
    if (x < 0 || y < 0 || x >= W || y >= H) return;
    const d = ctx.getImageData(x, y, 1, 1).data;
    const hex = '#' + [d[0], d[1], d[2]]
      .map(v => v.toString(16).padStart(2, '0')).join('');
    selectColor(hex);
    setTool('pencil');
  }

  /* ======================== UI: ЦВЕТА ======================== */
  function selectColor(hex) {
    currentColor = hex;
    chipEl.style.background = hex;
    hexEl.textContent = hex;
    document.querySelectorAll('.swatch').forEach(el => {
      el.classList.toggle('active',
        el.dataset.color.toLowerCase() === hex.toLowerCase());
    });
    if (tool === 'eraser') setTool('pencil');
  }

  function buildPalette() {
    const frag = document.createDocumentFragment();
    PALETTE.forEach(hex => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'swatch';
      b.dataset.color = hex;
      b.style.background = hex;
      b.title = hex;
      b.addEventListener('click', () => selectColor(hex));
      frag.appendChild(b);
    });
    paletteEl.appendChild(frag);
  }

  /* ======================== UI: ИНСТРУМЕНТЫ ======================== */
  function setTool(t) {
    tool = t;
    toolsEl.querySelectorAll('button').forEach(b => {
      b.classList.toggle('active', b.dataset.tool === t);
    });
    updateCursor();
  }

  toolsEl.addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-tool]');
    if (btn) setTool(btn.dataset.tool);
  });

  /* ======================== UI: РАЗМЕРЫ ======================== */
  function buildSizes() {
    const frag = document.createDocumentFragment();
    SIZES.forEach(n => {
      const b = document.createElement('button');
      b.type = 'button';
      b.textContent = n;
      b.dataset.size = n;
      b.addEventListener('click', () => setSize(n, n));
      frag.appendChild(b);
    });
    sizesEl.appendChild(frag);
  }

  function markActiveSize() {
    sizesEl.querySelectorAll('button').forEach(b => {
      b.classList.toggle('active', Number(b.dataset.size) === W && W === H);
    });
  }

  function setSize(w, h) {
    W = clamp(parseInt(w, 10) || 16, 1, 256);
    H = clamp(parseInt(h, 10) || 16, 1, 256);

    board.width = W;
    board.height = H;
    ctx.imageSmoothingEnabled = false;
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, W, H);

    undoStack.length = 0;
    zoom = 1; panX = 0; panY = 0;

    wInput.value = W;
    hInput.value = H;
    markActiveSize();
    layout();
  }

  document.getElementById('applySize').addEventListener('click', () => {
    setSize(wInput.value, hInput.value);
  });
  [wInput, hInput].forEach(inp => {
    inp.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') setSize(wInput.value, hInput.value);
    });
  });

  /* ======================== UI: ЗУМ ======================== */
  document.getElementById('zoomIn').addEventListener('click',  () => zoomFromCenter(1.5));
  document.getElementById('zoomOut').addEventListener('click', () => zoomFromCenter(1 / 1.5));
  document.getElementById('zoomFit').addEventListener('click', fitToScreen);

  /* ======================== UI: ДЕЙСТВИЯ ======================== */
  document.getElementById('undoBtn').addEventListener('click', undo);

  document.getElementById('clearBtn').addEventListener('click', () => {
    pushUndo();
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, W, H);
  });

  const gridBtn = document.getElementById('gridBtn');
  gridBtn.addEventListener('click', () => {
    showGrid = !showGrid;
    gridBtn.classList.toggle('on', showGrid);
    drawGrid();
  });

  document.getElementById('saveBtn').addEventListener('click', () => {
    const a = document.createElement('a');
    a.download = `superpaint_${W}x${H}.png`;
    a.href = board.toDataURL('image/png');
    a.click();
  });

  /* ======================== ГОРЯЧИЕ КЛАВИШИ ======================== */
  window.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT') return;

    if (e.code === 'Space' && !e.repeat) {
      spaceDown = true;
      e.preventDefault();
      updateCursor();
      return;
    }

    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
      e.preventDefault();
      undo();
      return;
    }
    if (e.ctrlKey || e.metaKey) return;

    switch (e.key.toLowerCase()) {
      case 'b': setTool('pencil'); break;
      case 'e': setTool('eraser'); break;
      case 'g': setTool('fill');   break;
      case 'i': setTool('picker'); break;
      case '0': fitToScreen();     break;
      case '+':
      case '=': zoomFromCenter(1.5); break;
      case '-':
      case '_': zoomFromCenter(1 / 1.5); break;
    }
  });

  window.addEventListener('keyup', (e) => {
    if (e.code === 'Space') {
      spaceDown = false;
      updateCursor();
    }
  });

  /* ======================== РЕСАЙЗ ======================== */
  if (window.ResizeObserver) {
    new ResizeObserver(() => layout()).observe(stage);
  } else {
    window.addEventListener('resize', layout);
  }

  /* ======================== СТАРТ ======================== */
  buildPalette();
  buildSizes();
  selectColor('#000000');
  setTool('pencil');
  setSize(16, 16);

  requestAnimationFrame(() => { layout(); });

})();
</script>
</body>
</html>
