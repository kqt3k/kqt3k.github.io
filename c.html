<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ц</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: sans-serif;
            overflow: hidden;
        }
        #big-c {
            /* Делаем букву почти во весь экран */
            font-size: 75vmin; 
            line-height: 1;
            cursor: pointer;
            user-select: none;
            transition: transform 0.1s ease;
        }
        /* Небольшой эффект нажатия для приятного отклика */
        #big-c:active {
            transform: scale(0.92);
        }
    </style>
</head>
<body>

    <div id="big-c" title="Нажми на меня">Ц</div>

    <audio id="sound" src="https://myinstants.com" preload="auto"></audio>

    <script>
        const letter = document.getElementById('big-c');
        const sound = document.getElementById('sound');

        letter.addEventListener('click', () => {
            // Сбрасываем время на начало, чтобы звук можно было спамить быстрыми нажатиями
            sound.currentTime = 0; 
            sound.play();
        });
    </script>

</body>
</html>
