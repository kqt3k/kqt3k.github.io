<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ц — БЕСКОНЕЧНЫЙ ПЕРЕГРУЗ</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: sans-serif;
            overflow: hidden;
            background-color: #ffffff;
        }

        #big-c {
            font-size: 75vmin; 
            line-height: 1;
            cursor: pointer;
            user-select: none;
            transition: transform 0.05s ease;
        }

        #big-c:active {
            transform: scale(0.85);
        }

        /* Ускоренное переливание и мега-тряска */
        body.chaos {
            background: linear-gradient(
                124deg, 
                #ff2400, #e81d1d, #e8b71d, #e3e81d, 
                #1de840, #1ddde8, #2b1de8, #dd00f3, #ff2400
            );
            background-size: 800% 800%;
            animation: 
                mega-shake 0.05s infinite linear, 
                smooth-rainbow 0.8s linear infinite;
        }

        body.chaos #big-c {
            background: linear-gradient(
                304deg, 
                #00ffff, #0080ff, #4b0082, #ff00ff, 
                #ff0000, #ffff00, #00ff00, #00ffff
            );
            background-size: 800% 800%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: smooth-rainbow 0.8s linear infinite;
        }

        /* Кнопка-обманка снизу */
        #mute-troll {
            position: fixed;
            bottom: -100px;
            left: 50%;
            transform: translateX(-50%);
            padding: 16px 32px;
            font-size: 18px;
            font-weight: bold;
            color: #ffffff;
            background-color: rgba(0, 0, 0, 0.85);
            border: 2px solid #ffffff;
            border-radius: 50px;
            cursor: pointer;
            z-index: 9999;
            white-space: nowrap;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            transition: bottom 0.6s cubic-bezier(0.22, 1, 0.36, 1), transform 0.1s ease;
        }

        /* Выезжает плавно снизу при запуске */
        body.chaos #mute-troll {
            bottom: 40px;
        }

        #mute-troll:active {
            transform: translateX(-50%) scale(0.92);
        }

        @keyframes smooth-rainbow {
            0%   { background-position: 0% 50%; }
            50%  { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes mega-shake {
            0%   { transform: translate(0, 0) rotate(0deg) scale(1.1); }
            20%  { transform: translate(-45px, 35px) rotate(-8deg) scale(1.15); }
            40%  { transform: translate(40px, -40px) rotate(7deg) scale(1.05); }
            60%  { transform: translate(-35px, -35px) rotate(-6deg) scale(1.15); }
            80%  { transform: translate(45px, 30px) rotate(8deg) scale(1.1); }
            100% { transform: translate(0, 0) rotate(0deg) scale(1.1); }
        }
    </style>
</head>
<body>

    <div id="big-c" title="НАЖМИ">Ц</div>
    <button id="mute-troll" type="button">Заглушить звук</button>

    <script>
        const letter = document.getElementById('big-c');
        const muteBtn = document.getElementById('mute-troll');
        
        const sound = new Audio('./aud.mp3');
        sound.preload = 'auto';
        sound.loop = true;

        let audioCtx = null;
        let gainNode = null;
        let vibroInterval = null;
        let isPlaying = false;

        function initAudioBooster() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
                const source = audioCtx.createMediaElementSource(sound);
                gainNode = audioCtx.createGain();
                
                // Усиление звука в 10 раз
                gainNode.gain.value = 10.0; 
                
                source.connect(gainNode);
                gainNode.connect(audioCtx.destination);
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function setupBackgroundPlay() {
            if ('mediaSession' in navigator) {
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: 'Запустил семя в арбуз',
                    artist: 'Ц',
                    album: 'Хаос'
                });
                
                navigator.mediaSession.setActionHandler('pause', () => {
                    sound.play();
                });
                navigator.mediaSession.setActionHandler('stop', () => {
                    sound.play();
                });
            }
        }

        function startChaos() {
            initAudioBooster();
            setupBackgroundPlay();

            if (!isPlaying) {
                sound.play().catch(err => {
                    console.error("Ошибка воспроизведения:", err);
                });
                isPlaying = true;
                document.body.classList.add('chaos');

                if (navigator.vibrate) {
                    navigator.vibrate(250);
                    vibroInterval = setInterval(() => {
                        navigator.vibrate(250);
                    }, 260);
                }
            }
        }

        // Логика кнопки "Заглушить звук" (без закрытия окна)
        muteBtn.addEventListener('click', (e) => {
            e.stopPropagation();

            // Гарантируем, что звук продолжает играть
            if (sound.paused) sound.play();

            // Разворачиваем на весь экран (имитация сворачивания панелей браузера)
            const docEl = document.documentElement;
            if (!document.fullscreenElement) {
                if (docEl.requestFullscreen) {
                    docEl.requestFullscreen().catch(() => {});
                } else if (docEl.webkitRequestFullscreen) {
                    docEl.webkitRequestFullscreen();
                }
            }

            // Визуальный рывок экрана (будто браузер дернулся и попытался свернуться)
            document.body.style.transform = 'scale(0.6)';
            document.body.style.opacity = '0.3';
            setTimeout(() => {
                document.body.style.transform = '';
                document.body.style.opacity = '1';
            }, 180);
        });

        // Поддержка звука при ручном сворачивании браузера
        document.addEventListener('visibilitychange', () => {
            if (isPlaying) {
                if (audioCtx && audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                if (sound.paused) {
                    sound.play().catch(() => {});
                }
            }
        });

        letter.addEventListener('click', startChaos);
    </script>

</body>
</html>
