<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ц — МАКСИМАЛЬНЫЙ ХАОС</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: sans-serif;
            overflow: hidden;
            background-color: #ffffff;
        }

        #big-c {
            font-size: 75vmin; 
            line-height: 1;
            cursor: pointer;
            user-select: none;
            transition: transform 0.05s ease;
        }

        #big-c:active {
            transform: scale(0.85);
        }

        /* Усиленный режим хаоса */
        body.chaos {
            animation: 
                mega-shake 0.05s infinite linear, 
                rainbow-bg 0.2s infinite linear;
        }

        body.chaos #big-c {
            animation: rainbow-text 0.2s infinite linear;
        }

        /* Экстремальная тряска экрана */
        @keyframes mega-shake {
            0%   { transform: translate(0, 0) rotate(0deg) scale(1.1); }
            20%  { transform: translate(-45px, 35px) rotate(-8deg) scale(1.15); }
            40%  { transform: translate(40px, -40px) rotate(7deg) scale(1.05); }
            60%  { transform: translate(-35px, -35px) rotate(-6deg) scale(1.15); }
            80%  { transform: translate(45px, 30px) rotate(8deg) scale(1.1); }
            100% { transform: translate(0, 0) rotate(0deg) scale(1.1); }
        }

        /* Радужный фон */
        @keyframes rainbow-bg {
            0%   { background-color: #ff0000; }
            16%  { background-color: #ff7f00; }
            33%  { background-color: #ffff00; }
            50%  { background-color: #00ff00; }
            66%  { background-color: #0000ff; }
            83%  { background-color: #4b0082; }
            100% { background-color: #9400d3; }
        }

        /* Радужная буква */
        @keyframes rainbow-text {
            0%   { color: #00ffff; }
            16%  { color: #0080ff; }
            33%  { color: #0000ff; }
            50%  { color: #ff00ff; }
            66%  { color: #ffff00; }
            83%  { color: #00ff00; }
            100% { color: #ffffff; }
        }
    </style>
</head>
<body>

    <div id="big-c" title="НАЖМИ">Ц</div>

    <script>
        const letter = document.getElementById('big-c');
        // Подключаем локальный файл aud.mp3 из той же папки
        const sound = new Audio('./aud.mp3');
        sound.preload = 'auto';

        let vibroInterval = null;
        let isPlaying = false;

        function startChaos() {
            sound.currentTime = 0;
            sound.play().catch(err => {
                console.error("Ошибка воспроизведения:", err);
            });

            if (isPlaying) return;
            isPlaying = true;

            document.body.classList.add('chaos');

            if (navigator.vibrate) {
                navigator.vibrate(250);
                vibroInterval = setInterval(() => {
                    navigator.vibrate(250);
                }, 260);
            }
        }

        function stopChaos() {
            isPlaying = false;
            document.body.classList.remove('chaos');
            if (vibroInterval) {
                clearInterval(vibroInterval);
                vibroInterval = null;
            }
            if (navigator.vibrate) {
                navigator.vibrate(0);
            }
        }

        letter.addEventListener('click', startChaos);
        sound.addEventListener('ended', stopChaos);
    </script>

</body>
</html>
