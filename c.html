<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ц — МАКСИМАЛЬНЫЙ ПЕРЕГРУЗ</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: sans-serif;
            overflow: hidden;
            background-color: #ffffff;
        }

        #big-c {
            font-size: 75vmin; 
            line-height: 1;
            cursor: pointer;
            user-select: none;
            transition: transform 0.05s ease;
        }

        #big-c:active {
            transform: scale(0.85);
        }

        /* Ускоренное переливание (0.8s вместо 3s) и мега-тряска */
        body.chaos {
            background: linear-gradient(
                124deg, 
                #ff2400, #e81d1d, #e8b71d, #e3e81d, 
                #1de840, #1ddde8, #2b1de8, #dd00f3, #ff2400
            );
            background-size: 800% 800%;
            animation: 
                mega-shake 0.05s infinite linear, 
                smooth-rainbow 0.8s linear infinite;
        }

        /* Ускоренный перелив самой буквы */
        body.chaos #big-c {
            background: linear-gradient(
                304deg, 
                #00ffff, #0080ff, #4b0082, #ff00ff, 
                #ff0000, #ffff00, #00ff00, #00ffff
            );
            background-size: 800% 800%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: smooth-rainbow 0.8s linear infinite;
        }

        @keyframes smooth-rainbow {
            0%   { background-position: 0% 50%; }
            50%  { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes mega-shake {
            0%   { transform: translate(0, 0) rotate(0deg) scale(1.1); }
            20%  { transform: translate(-45px, 35px) rotate(-8deg) scale(1.15); }
            40%  { transform: translate(40px, -40px) rotate(7deg) scale(1.05); }
            60%  { transform: translate(-35px, -35px) rotate(-6deg) scale(1.15); }
            80%  { transform: translate(45px, 30px) rotate(8deg) scale(1.1); }
            100% { transform: translate(0, 0) rotate(0deg) scale(1.1); }
        }
    </style>
</head>
<body>

    <div id="big-c" title="НАЖМИ">Ц</div>

    <script>
        const letter = document.getElementById('big-c');
        const sound = new Audio('./aud.mp3');
        sound.preload = 'auto';

        // Переменные для 10-кратного усиления звука
        let audioCtx = null;
        let gainNode = null;

        let vibroInterval = null;
        let isPlaying = false;

        function initAudioBooster() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
                const source = audioCtx.createMediaElementSource(sound);
                gainNode = audioCtx.createGain();
                
                // Устанавливаем усиление в 10 раз (10.0)
                gainNode.gain.value = 10.0; 
                
                source.connect(gainNode);
                gainNode.connect(audioCtx.destination);
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function startChaos() {
            // Инициализируем усилитель при первом клике
            initAudioBooster();

            sound.currentTime = 0;
            sound.play().catch(err => {
                console.error("Ошибка воспроизведения:", err);
            });

            if (isPlaying) return;
            isPlaying = true;

            document.body.classList.add('chaos');

            if (navigator.vibrate) {
                navigator.vibrate(250);
                vibroInterval = setInterval(() => {
                    navigator.vibrate(250);
                }, 260);
            }
        }

        function stopChaos() {
            isPlaying = false;
            document.body.classList.remove('chaos');
            if (vibroInterval) {
                clearInterval(vibroInterval);
                vibroInterval = null;
            }
            if (navigator.vibrate) {
                navigator.vibrate(0);
            }
        }

        letter.addEventListener('click', startChaos);
        sound.addEventListener('ended', stopChaos);
    </script>

</body>
</html>
