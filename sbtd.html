<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SBTD Wiki — Kqt3k</title>
<style>
:root{--bg:#0f1117;--c:#181c26;--a:#3b82f6;--t:#f3f4f6;--m:#9ca3af;--b:#2a3142}
*{box-sizing:border-box;margin:0;padding:0;font-family:sans-serif}
body{background:var(--bg);color:var(--t)}
header{background:#161b29;border-bottom:1px solid var(--b);padding:14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.logo{font-weight:800;font-size:1.1rem}.logo span{background:var(--a);padding:4px 8px;border-radius:6px;margin-right:6px}
.hdr-r{display:flex;gap:8px;align-items:center}
.btn{text-decoration:none;color:#fff;background:#252b3b;padding:7px 12px;border-radius:8px;font-size:.85rem;border:1px solid var(--b);cursor:pointer;font-weight:600}
.btn-lang{background:var(--a);border-color:var(--a)}
nav{display:flex;gap:8px;padding:14px;overflow-x:auto}
.tab{background:var(--c);color:var(--m);border:1px solid var(--b);padding:8px 14px;border-radius:8px;cursor:pointer;white-space:nowrap}
.tab.active{background:var(--a);color:#fff;border-color:var(--a)}
main{max-width:1100px;margin:0 auto;padding:0 14px 40px}
.sec{display:none}.sec.active{display:block}
input{width:100%;background:var(--c);border:1px solid var(--b);color:#fff;padding:10px;border-radius:8px;margin-bottom:12px}
.flt{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.fb{background:var(--c);color:var(--m);border:1px solid var(--b);padding:6px 10px;border-radius:6px;font-size:.8rem;cursor:pointer}
.fb.active{background:#2b354b;color:#fff;border-color:var(--a)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{background:var(--c);border:1px solid var(--b);border-radius:12px;overflow:hidden;cursor:pointer}
.img{height:125px;background:#12151e;display:flex;align-items:center;justify-content:center;font-size:2.6rem;position:relative;border-bottom:1px solid var(--b)}
.img img{width:100%;height:100%;object-fit:cover}
.tag{position:absolute;top:8px;right:8px;background:var(--a);padding:3px 8px;border-radius:5px;font-size:.7rem;font-weight:700}
.body{padding:12px}.title{font-weight:700;margin-bottom:4px}.desc{color:var(--m);font-size:.84rem;margin-bottom:10px}
.st{display:flex;justify-content:space-between;background:#12151e;padding:8px;border-radius:6px;font-size:.78rem}
.b-item{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:14px;margin-bottom:12px}
.b-item h3{margin-bottom:6px}.b-item ol{padding-left:18px;color:#d1d5db;font-size:.88rem}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;padding:16px;z-index:99}
.modal.open{display:flex}.m-box{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:18px;max-width:480px;width:100%;position:relative}
.cls{position:absolute;top:10px;right:10px;background:#252b3b;color:#fff;border:none;width:28px;height:28px;border-radius:6px;cursor:pointer}
.lvl-row{display:flex;justify-content:space-between;border-bottom:1px solid var(--b);padding:6px 0;font-size:.84rem}
</style>
</head>
<body>
<header>
  <div class="logo"><span>SBTD</span>Wiki by Kqt3k</div>
  <div class="hdr-r">
    <button id="langBtn" class="btn btn-lang" onclick="toggleLang()">🌐 RU</button>
    <a id="playBtn" href="https://roblox.com" target="_blank" class="btn">🎮 Play</a>
  </div>
</header>
<nav>
  <button id="tTowers" class="tab active" onclick="go('towers',this)">🗼 Towers</button>
  <button id="tBadges" class="tab" onclick="go('badges',this)">🏅 Badges</button>
  <button id="tMaps" class="tab" onclick="go('maps',this)">🗺️ Maps</button>
  <button id="tEvents" class="tab" onclick="go('events',this)">🎉 Meta & Events</button>
</nav>
<main>
  <div id="towers" class="sec active">
    <input id="qT" placeholder="Search tower..." oninput="drawT()">
    <div id="fltBox" class="flt"></div>
    <div id="gT" class="grid"></div>
  </div>
  <div id="badges" class="sec"><div id="gB"></div></div>
  <div id="maps" class="sec"><div id="gM" class="grid"></div></div>
  <div id="events" class="sec"><div id="gE"></div></div>
</main>
<div id="mod" class="modal" onclick="if(event.target.id==='mod')this.classList.remove('open')">
  <div class="m-box"><button class="cls" onclick="document.getElementById('mod').classList.remove('open')">✕</button><div id="mC"></div></div>
</div>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
